name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The test suite is pure Node (no Electron, no network), so no install.
      - run: npm test
      - run: node scripts/gen-icons.js
